name: Court records update

on:
  schedule:
    - cron: "0 12 * * 1"  # Mondays 12:00 UTC
  workflow_dispatch:
    inputs:
      full:
        description: "Full historical sweep (instead of last 60 days)"
        type: boolean
        default: false
      from_file:
        description: "Classify from data/court_candidates.json (no CourtListener searches; document text is still fetched)"
        type: boolean
        default: false
      reclassify_opinions:
        description: "Re-run opinion candidates already marked seen (after a text-fetch or classifier fix)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-update  # serialize with the daily and backfill jobs
  cancel-in-progress: false

jobs:
  courts:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      # Scheduled runs resolve to main. A workflow_dispatch from another branch
      # runs and commits on that branch, so a pipeline change can be exercised
      # before it is merged; only main deploys to Pages (see below).
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Sweep court records
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          COURTLISTENER_TOKEN: ${{ secrets.COURTLISTENER_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: python pipeline/courts.py --push-progress ${{ inputs.full && '--full' || '' }} ${{ inputs.from_file && '--from-file' || '' }} ${{ inputs.reclassify_opinions && '--reclassify-opinions' || '' }}

      - name: Commit updated data and site
        id: commit
        if: always()
        run: |
          git config user.name "flock-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout -- site || true
          git pull --rebase --autostash origin ${{ github.ref_name }}
          python pipeline/validate_data.py
          python pipeline/build_site.py
          git add data site
          git diff --cached --quiet || git commit -m "Court records update $(date -u +%F)"
          git push

      - name: Configure Pages
        if: always() && steps.commit.outcome == 'success' && github.ref_name == 'main'
        uses: actions/configure-pages@v5

      - name: Upload site
        if: always() && steps.commit.outcome == 'success' && github.ref_name == 'main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        if: always() && steps.commit.outcome == 'success' && github.ref_name == 'main'
        uses: actions/deploy-pages@v4
