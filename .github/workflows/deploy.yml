name: Deploy site

# Rebuild the site from existing data and publish — no fetching, no
# classification. Runs automatically on pushes that change site-generating
# code, and on demand. The daily/court/backfill jobs still deploy after
# they update data.

on:
  push:
    branches: [main]
    paths:
      # Site-generating code...
      - "pipeline/build_site.py"
      - "pipeline/make_og_image.py"
      - "pipeline/assets/**"
      # ...and the data itself, so hand edits and merges publish without
      # waiting for the next cron. Bot pushes use GITHUB_TOKEN, whose events
      # do not trigger workflows, so the daily job cannot retrigger this.
      - "data/**"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-update  # serialize with data-writing jobs
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Build site
        run: |
          python pipeline/validate_data.py
          python pipeline/build_site.py

      - name: Commit rebuilt site
        run: |
          git config user.name "flock-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site
          git diff --cached --quiet || git commit -m "Rebuild site"
          git pull --rebase --autostash origin main
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
