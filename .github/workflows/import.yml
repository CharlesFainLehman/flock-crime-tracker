name: Import candidates (manual)

on:
  workflow_dispatch:
    inputs:
      file:
        description: "Candidates JSON path (relative to repo)"
        required: true
        default: "data/imports/flock_success_stories_2026-08.json"

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Import
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: python pipeline/import_candidates.py "${{ inputs.file }}" --push-progress
      - name: Commit results
        if: always()
        run: |
          git config user.name "flock-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase --autostash origin ${{ github.ref_name }}
          python pipeline/validate_data.py
          git add data
          git diff --cached --quiet || git commit -m "Import: ${{ inputs.file }}"
          git push
